on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  ACTIONS_RUNNER_PRINT_DEPRECATION_WARNINGS: false
  RENV_CONFIG_INSTALL_FROM_SOURCE: true

jobs:
  update-instances:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.6.2'
    - name: Install dependencies
      run: sudo apt-get install libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libudunits2-dev pandoc libfontconfig1-dev libgit2-dev
    - name: Install GDAL
      run: |
        sudo add-apt-repository ppa:ubuntugis/ubuntugis-unstable 
        sudo apt-get update 
        sudo apt-get install libgdal-dev libgeos-dev libproj-dev
    - uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.PRIVATE_REPO_KEY }}
    - name: Configure R Geospatial & Git Env
      run: |
        Rscript -e 'options(pkgType = "source"); install.packages(c("gert", "terra", "sf"), type = "source")'
    - name: Update portfolio
      run: Rscript update-portfolio.R
    - name: Push changes
      run: |
        git config --global user.name github-actions
        git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
        git remote set-url origin git@github.com:arieloliver/portfolio.git
        git checkout main
        cp inst/output/portfolio-USGS-06752260.html docs/index.html
        git add docs/index.html
        git commit -m '[CI] Auto update portfolio' || exit 0
        git push